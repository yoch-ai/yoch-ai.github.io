<!doctype html>
<!-- Share image source (1200×630). Screenshot it at exactly 1200×630 to make assets/og.jpg. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@500&family=Karantina:wght@700&display=block">
<style>
  html, body { margin: 0; inline-size: 1200px; block-size: 630px; overflow: hidden; background: #0D0B0A; color: #EAE7E1; }
  .wall { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .wall img { inline-size: 100%; block-size: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgb(13 11 10 / .97) 0%, rgb(13 11 10 / .8) 38%, rgb(13 11 10 / .1) 75%); }
  .copy { position: absolute; inset-inline: 64px; inset-block-end: 54px; }
  h1 { margin: 0; font: 700 128px/.86 "Karantina", sans-serif; }
  .sub { display: block; font-size: .5em; line-height: 1; margin-block-start: .16em; }
  .mark { position: relative; display: inline-block; }
  .mark svg { position: absolute; inset-block-start: -16%; inset-inline-start: -18%; inline-size: 136%; block-size: 128%; overflow: visible; }
  .mark path { fill: none; stroke: #E2412B; stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .logo { position: absolute; inset-block-start: 40px; inset-inline-end: 56px; block-size: 92px; }
  p { margin: 18px 0 0; font: 500 26px/1.3 "IBM Plex Sans Hebrew", sans-serif; opacity: .85; }
</style>
</head>
<body>
  <div class="wall">
    <img src="../assets/media/bridal/poster-lg.webp" alt="">
    <img src="../assets/media/chess/poster-lg.webp" alt="">
    <img src="../assets/media/nuvelie/poster-lg.webp" alt="">
    <img src="../assets/media/shoes/poster-lg.webp" alt="">
  </div>
  <div class="shade"></div>
  <img class="logo" src="../assets/img/logo.png" alt="">
  <div class="copy">
    <h1>סרטים לעסק שלכם. <span class="sub">בעין של <span class="mark">צלמת<svg viewBox="0 0 200 100" preserveAspectRatio="none"><path d="M172 22 C124 3 36 6 13 44 C-3 77 66 99 130 92 C186 85 203 52 183 30 C167 14 120 8 86 12"/></svg></span>.</span></h1>
    <p>יוכבד פולונסקי · Yoch AI · נדל״ן, אופנה וכלות, מוצרים וקליפים</p>
  </div>
</body>
</html>
